<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卒業単位計算機</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <div>
      <p class="school-name">関東学院大学 理工学部 理工学科 情報ネット・メディアコース</p>
      <h1>卒業単位計算機</h1>
    </div>

    <div class="total-box">
      <div><span id="totalCredits">0</span><span class="total-small"> / 124 単位</span></div>
      <p id="graduationStatus" class="status-text">未達成</p>
    </div>
  </header>

  <section id="summaryPanel" class="summary-panel summary-ng">
    <div class="summary-main">総単位 0 / 124（あと124単位）</div>
    <div class="summary-shortage">不足: 計算前</div>
  </section>

  <main id="mainView" class="view main-layout">
    <section class="left-area">
      <div id="requirementList" class="requirement-list"></div>

      <div class="info-panel">
        <h2>未修得の必修科目</h2>
        <ul id="missingRequiredList"></ul>
      </div>

      <div class="info-panel">
        <h2>不足している選択必修</h2>
        <ul id="missingChoiceList"></ul>
      </div>

      <div class="info-panel">
        <h2>注意</h2>
        <ul id="warningList"></ul>
      </div>
    </section>

    <section class="right-area">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="科目名・旧科目名で検索">

        <select id="categorySelect">
          <option value="all">すべての分類</option>
        </select>

        <select id="subCategorySelect">
          <option value="all">すべての区分</option>
        </select>

        <select id="courseSelect">
          <option value="all">すべてのコース</option>
        </select>

        <select id="requirementSelect">
          <option value="all">すべての必選別</option>
        </select>


        <button id="resetFilterButton" type="button">絞り込み解除</button>

        <button id="saveButton" type="button">保存</button>
        <button id="openAddViewButton" type="button">科目を追加</button>
        <button id="openDeleteViewButton" type="button" class="danger-button">追加した科目を削除</button>
        <button id="clearButton" type="button" class="danger-button">クリア</button>
      </div>

      <div class="subject-info">
        <span id="selectedCount">選択中 0科目</span>
        <span id="shownCount">表示 0科目</span>
      </div>

      <div id="candidateFilterInfo" class="candidate-filter-info hidden-field"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="check-column">修得</th>
              <th>科目名</th>
              <th>単位</th>
              <th>分類</th>
              <th>区分</th>
              <th>コース</th>
              <th>分野</th>
              <th>必選別</th>
              <th>計算先</th>
              <th>授業形態</th>
              <th>旧科目名</th>
            </tr>
          </thead>
          <tbody id="subjectTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <main id="addView" class="view single-view hidden-view">
    <section class="screen-panel">
      <div class="screen-head">
        <h2>科目を追加</h2>
        <button id="backFromAddButton" type="button">戻る</button>
      </div>

      <p id="addMessage" class="action-message"></p>

      <div class="form-grid">
        <label>
          <span>科目名</span>
          <input id="addNameInput" type="text">
        </label>

        <label>
          <span>単位数</span>
          <select id="addCreditsSelect"></select>
        </label>

        <label>
          <span>分類</span>
          <select id="addCategorySelect"></select>
        </label>

        <label>
          <span>区分</span>
          <select id="addSubCategorySelect"></select>
        </label>

        <label>
          <span>コース</span>
          <select id="addCourseSelect"></select>
        </label>

        <label id="newCourseLabel" class="hidden-field">
          <span>新しいコース</span>
          <input id="addNewCourseInput" type="text">
        </label>

        <label>
          <span>分野</span>
          <select id="addFieldSelect"></select>
        </label>

        <label id="newFieldLabel" class="hidden-field">
          <span>新しい分野</span>
          <input id="addNewFieldInput" type="text">
        </label>

        <label>
          <span>必選別</span>
          <select id="addRequirementSelect"></select>
        </label>

        <label>
          <span>計算先</span>
          <select id="addCountsAsSelect"></select>
        </label>

        <label>
          <span>授業形態</span>
          <select id="addClassTypeSelect"></select>
        </label>

        <label>
          <span>旧科目名</span>
          <input id="addOldNameInput" type="text">
        </label>

        <button id="addSubjectButton" type="button">追加</button>
      </div>
    </section>
  </main>

  <main id="deleteView" class="view single-view hidden-view">
    <section class="screen-panel">
      <div class="screen-head">
        <h2>追加した科目を削除</h2>
        <button id="backFromDeleteButton" type="button">戻る</button>
      </div>

      <p id="deleteMessage" class="action-message"></p>

      <div class="table-wrap delete-table-wrap">
        <table>
          <thead>
            <tr>
              <th class="check-column">選択</th>
              <th>科目名</th>
              <th>単位</th>
              <th>分類</th>
              <th>区分</th>
              <th>コース</th>
              <th>分野</th>
              <th>必選別</th>
              <th>計算先</th>
              <th>授業形態</th>
              <th>旧科目名</th>
            </tr>
          </thead>
          <tbody id="deleteSubjectTableBody"></tbody>
        </table>
      </div>

      <div class="screen-actions">
        <button id="deleteAddedSubjectButton" type="button" class="danger-button">削除</button>
      </div>
    </section>
  </main>

  <script src="calculate.js"></script>
  <script src="app.js"></script>
</body>
</html>
